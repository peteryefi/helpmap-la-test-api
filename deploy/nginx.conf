# Reverse proxy: nginx (port 80/443) -> gunicorn/uvicorn (127.0.0.1:8000)
#
# Why this is needed at all: the PWA is served over HTTPS from Amplify.
# Browsers block a plain-HTTP fetch() from an HTTPS page (mixed content),
# so this API must be reachable over HTTPS too -- not just "nice to have".
#
# Setup on the Lightsail instance:
#   1. Point a DNS record (e.g. api-testbed.helpmap.us) at the instance's
#      static IP.
#   2. sudo cp deploy/nginx.conf /etc/nginx/sites-available/helpmap-api
#      sudo ln -s /etc/nginx/sites-available/helpmap-api /etc/nginx/sites-enabled/
#      sudo nginx -t && sudo systemctl reload nginx
#   3. sudo certbot --nginx -d api-testbed.helpmap.us
#      Certbot rewrites this file in place to add the HTTPS server block,
#      the redirect from 80->443, and auto-renewal.

server {
    listen 80;
    server_name api-testbed.helpmap.us;  # replace with the real subdomain

    # nginx defaults to a 1MB request body limit, which will silently
    # 413-reject a report that carries a base64-encoded photo (those can
    # run several MB). Raised to comfortably exceed MAX_PHOTO_BASE64_CHARS
    # in app/config.py (8,000,000 chars ≈ 8MB) plus JSON envelope overhead.
    client_max_body_size 10m;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
